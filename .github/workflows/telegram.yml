name: Telegram bridge

# Sends whatever Claude commits to telegram/outbox/, and saves the owner's
# replies to telegram/inbox.jsonl. The bot token lives only in the
# TELEGRAM_BOT_TOKEN repository secret.
on:
  push:
    branches: [main]
    paths: ["telegram/outbox/**"]
  schedule:
    - cron: "*/15 * * * *"   # pick up the owner's replies
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-bridge
  cancel-in-progress: false

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Send outbox and read replies
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 telegram/bridge.py

      - name: Commit results
        run: |
          git config user.name "telegram-bridge"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A telegram
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "telegram: bridge run [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::could not push results"; exit 1
